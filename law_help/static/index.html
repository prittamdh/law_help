<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>law_help: Rajasthan High Court judgments</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">law_help</a>
    <span id="corpus">Rajasthan High Court judgments</span>
  </header>
  <main>
    <form class="search" id="search">
      <div class="bar">
        <input type="search" name="q" placeholder='Search judgments, e.g. bail "NDPS Act" -dismissed' aria-label="Keywords" autofocus>
        <button type="submit">Search</button>
      </div>
      <div class="layout">
        <aside class="filters">
          <h2>Filters</h2>
          <label for="f-bench">Bench</label>
          <select id="f-bench" name="bench">
            <option value="">Both benches</option>
            <option value="jaipur">Jaipur</option>
            <option value="jodhpur">Jodhpur</option>
          </select>

          <label>Decided between</label>
          <div class="row">
            <input type="date" name="decided_from" aria-label="Decided from" title="From">
            <input type="date" name="decided_to" aria-label="Decided to" title="To">
          </div>

          <label for="f-judge">Judge</label>
          <input id="f-judge" name="judge" list="judges" placeholder="e.g. SAMEER JAIN" autocomplete="off">
          <datalist id="judges"></datalist>

          <label for="f-act">Act</label>
          <input id="f-act" name="act" list="acts" placeholder="e.g. IPC, NDPS Act" autocomplete="off">
          <datalist id="acts"></datalist>
          <label for="f-section">Section</label>
          <input id="f-section" name="section" placeholder="e.g. 302, 120-B">
          <p class="hint">Acts and sections are read from the judgment text, so only judgments with extracted text match.</p>

          <label for="f-case-type">Case type</label>
          <input id="f-case-type" name="case_type" list="case-types" placeholder="e.g. CW, CRLMB" autocomplete="off">
          <datalist id="case-types"></datalist>

          <label for="f-disposal">Outcome</label>
          <select id="f-disposal" name="disposal"><option value="">Any outcome</option></select>

          <div class="actions">
            <button type="button" class="link" id="clear">Clear filters</button>
            <button type="submit">Apply</button>
          </div>
        </aside>
        <section aria-live="polite">
          <p class="summary" id="summary"></p>
          <ol class="results" id="results"></ol>
          <div class="pager" id="pager" hidden>
            <button type="button" id="prev">Previous</button>
            <span id="page-info"></span>
            <button type="button" id="next">Next</button>
          </div>
        </section>
      </div>
    </form>
  </main>
  <footer class="site">
    Data: <a href="https://registry.opendata.aws/indian-high-court-judgments/">Indian High Court Judgments</a> (CC-BY-4.0), sourced from eCourts.
    Always check the original PDF before relying on a judgment.
  </footer>
  <script src="/static/common.js"></script>
  <script src="/static/search.js"></script>
</body>
</html>
