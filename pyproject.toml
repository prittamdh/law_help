[project]
name = "law_help"
version = "0.1.0"
description = "Case law in one place, starting with the Rajasthan High Court"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pyarrow>=15",
    "pypdf>=4",
    "pypdfium2>=4.30",
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["law_help"]

[tool.setuptools.package-data]
law_help = ["schema.sql", "static/*", "static/fonts/*", "data/*.json", "data/acts/*.json"]
